services:
  db:
    restart: always
    image: postgres:14-alpine
    shm_size: 256mb
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
    volumes:
      - ./postgres14:/var/lib/postgresql/data
    env_file: .env
    networks:
      mastodon:
        ipv4_address: 10.1.48.1

  redis:
    restart: always
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
    volumes:
      - ./redis:/data
    networks:
      mastodon:
        ipv4_address: 10.1.48.1

  es:
    restart: always
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.15
    env_file: .env
    healthcheck:
       test: ["CMD-SHELL", "curl --silent --fail localhost:9200/_cluster/health || exit 1"]
    volumes:
       - ./elasticsearch:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    #ports:
    #  - 9200:9200
    networks:
      mastodon:
        ipv4_address: 10.1.48.1

  web:
    image: ghcr.io/mastodon/mastodon:v4.7.3
    restart: always
    env_file: .env
    command: bundle exec puma -C config/puma.rb
    healthcheck:
      test: ['CMD-SHELL',"curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1"]
    #ports:
    #  - 3000:3000
    depends_on:
      - db
      - redis
      - es
    volumes:
      - ./public/system:/mastodon/public/system
    networks:
      mastodon:
        ipv4_address: 10.1.48.1

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.7.3
    restart: always
    env_file: .env
    command: node ./streaming/index.js
    healthcheck:
      test: ['CMD-SHELL', "curl -s --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q 'OK' || exit 1"]
    #ports:
    #  - 4000:4000
    depends_on:
      - db
      - redis
    networks:
      mastodon:
        ipv4_address: 10.1.48.1

  sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.7.3
    restart: always
    env_file: .env
    command: bundle exec sidekiq
    depends_on:
      - db
      - redis
    volumes:
      - ./public/system:/mastodon/public/system
    healthcheck:
      test: ['CMD-SHELL', "ps aux | grep '[s]idekiq\ 8' || false"]
    networks:
      mastodon:
        ipv4_address: 10.1.48.1

networks:
  mastodon:
    name: net-mastodon
    driver: bridge
    ipam:
     config:
       - subnet: 10.1.48.0/24
         gateway: 10.1.48.1